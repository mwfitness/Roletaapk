# TSGames — Uma criação de Thalisson Torricelli.
# Compila o app na nuvem: testes -> APK de depuração (assinado com a chave de depuração do Android Gradle Plugin).
name: Build TSGames APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      # Se você enviou o projeto como "tsgames.zip" (método mais simples pelo celular), extrai aqui.
      - name: Extrair tsgames.zip (se necessário)
        run: |
          if [ ! -d app ] && [ -f tsgames.zip ]; then
            unzip -q -o tsgames.zip
          fi
          ls -la

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Testes automatizados
        run: npm test

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Os servidores do GitHub já trazem o Android SDK (ANDROID_HOME); só aceitamos as licenças.
      - name: Preparar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK de depuração
        run: gradle --no-daemon assembleDebug

      - name: Conferir o APK
        run: |
          ls -la app/build/outputs/apk/debug/
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep "assets/www/index.html"

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: TSGames-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

